server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # NB : un add_header dans un location ECRASE ceux du niveau serveur : les en-tetes de securite sont donc inclus
  # explicitement dans chaque location qui sert des pages ou des fichiers.
  # /api/ n'en recoit pas de nginx : le backend (Helmet) envoie deja les siens, plus stricts pour du JSON.

  location /api/ {
    client_max_body_size 12m; # pièces jointes de la messagerie (8 Mo utiles, encodés en base64)
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
